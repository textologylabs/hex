type: component
name: vite-ts-spa
version: 0.1.0
kind: webapp

prompts:
  - project_name:
      type: string
      required: true
      description: Package name (e.g. my-app)
      pattern: '^[a-z][a-z0-9-]*$'
  - description:
      type: string
      default: ''
      description: Short description
  - author:
      type: string
      default: ''
      description: Author
  - license:
      type: enum
      choices: [MIT, Apache-2.0]
      default: MIT
      description: License

sections:
  - title: Basics
    prompts: [project_name, description, author]
  - title: Licence
    prompts: [license]

# Deploy + CI/CD (M12). The generated app pins both stanzas in its
# lockfile at render time, so `hex deploy` knows what adapter to invoke
# and a `cicd-github-actions` provider can emit a workflow that calls
# the same adapter on every push.
deploy:
  adapter: vercel

cicd:
  provider: github-actions
  node-version: '20'

hooks:
  post_render:
    - rename: { from: gitignore, to: .gitignore }

setup:
  message: |
    Your Vite SPA is scaffolded. Let's get it live.

    These steps take you from install to a live URL, then wire up auto-deploy
    on every push. Each step tells you what it does before it runs. Before you
    start, make sure you have:
      - the GitHub CLI authenticated  (run `gh auth status`; if not, `gh auth login`)
      - a Vercel account              (a browser login opens during setup)
  tasks:
    - id: install-deps
      title: Install dependencies
      run: npm install
      detail: |
        Installs the project's dependencies with npm.
    - id: git-init
      title: Initialise a git repository
      run: git init -b main
      detail: |
        Creates a local git repository on the `main` branch.
    - id: git-stage
      title: Stage every scaffolded file
      run: git add .
      detail: |
        Stages everything Hex generated — including the CI workflow at
        .github/workflows/deploy.yml — ready for the first commit.
    - id: git-commit-initial
      title: Make the initial commit
      run: git commit -m "initial commit"
      detail: |
        Records the scaffolded project as your first commit.
    - id: create-github-repo
      title: Create the GitHub repository
      run: gh repo create --source=. --private --remote=origin
      detail: |
        Creates a PRIVATE GitHub repo named after this folder and wires it up
        as `origin` (no push yet — that comes last). The repo has to exist
        before the deploy secret can be stored on it and before CI can run.
        Requires the GitHub CLI to be authenticated (`gh auth status`).
    - id: vercel-link
      title: Link the project to Vercel
      run: npx --yes vercel link
      detail: |
        A browser opens — log in to Vercel and pick or create the project this
        app deploys to. This login session is what your first deploy uses, so
        no token is needed yet. The vercel CLI is fetched on demand via npx
        (no global install). Accept its prompts.
    - id: first-deploy
      title: First deploy — your live URL
      run: hex deploy
      detail: |
        Deploys straight from the Vercel login you just did — no token needed —
        and prints your live URL. This is your app on the internet, right now.
    - id: configure-vercel-token
      title: Enable auto-deploy on every push
      open: https://vercel.com/account/tokens
      run: gh secret set VERCEL_TOKEN
      detail: |
        To let GitHub deploy for you on every push, CI needs its own token (it
        can't reuse your browser login). On the tokens page that just opened,
        mint a token (any name, no expiry needed, default scope), copy it,
        return here, and paste it at the `gh secret set` prompt. Hex stores it
        as the repo's VERCEL_TOKEN secret — the workflow at
        .github/workflows/deploy.yml reads it on every push to main.
    - id: push-to-github
      title: Push to GitHub (triggers the first CI deploy)
      run: git push -u origin main
      detail: |
        Pushes `main` to GitHub. Because the VERCEL_TOKEN secret is already in
        place, the deploy workflow runs and ships this push automatically — and
        every push after it.
